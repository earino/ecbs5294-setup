[project]
name = "ecbs5294-setup"
version = "0.1.0"
description = "ECBS5294 setup check"
requires-python = ">=3.10"
dependencies = [
    "duckdb==1.5.5",
    "pandas>=2.2",
    "ipykernel>=6.29",
]

# CI only: executes the notebooks. A plain `uv sync` never installs it.
[dependency-groups]
ci = ["nbconvert>=7.16"]
